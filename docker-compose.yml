services:
  backend:
    build:
      context: ./football_sim_backend
      dockerfile: Dockerfile
    container_name: football-sim-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/simulations.db
      - DEFAULT_RTP=0.96
      - PYTHONUNBUFFERED=1  # Ensure Python output is not buffered
    volumes:
      # Persist database between container restarts
      - backend-data:/app/data
      # Mount source code for auto-reload on changes (read-write for file watching)
      - ./football_sim_backend/app:/app/app
    # Override command to use uvicorn with auto-reload for development
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - football-sim-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: football-sim-dashboard
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - football-sim-network

  sports-betting-frontend:
    build:
      context: ./sports-betting-frontend
      dockerfile: Dockerfile
      args:
        - VITE_SIMULATION_API_URL=http://localhost:8000
    container_name: sports-betting-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - football-sim-network

volumes:
  backend-data:
    driver: local

networks:
  football-sim-network:
    driver: bridge
